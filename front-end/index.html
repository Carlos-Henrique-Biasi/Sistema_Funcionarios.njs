<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login da Empresa - Meu SaaS</title>
    <!-- Link para importar o CSS -->
    <link rel="stylesheet" href="styleIndex.css">
</head>
<body>

    <!-- ADICIONE A CLASSE AQUI: class="login-container" -->
    <div class="login-container">
        <h2>Entrar no Sistema</h2> <!-- Dica: Se quiser colocar um título, ajudei adicionando aqui -->

        <!-- Este é o formulário de login. -->
        <form id="form-login">
            
            <!-- ADICIONE A CLASSE AQUI NO LABEL: class="form-label" -->
            <label class="form-label">E-mail da Empresa:</label>
            <!-- ADICIONE A CLASSE AQUI NO INPUT: class="form-input" -->
            <input type="email" id="email" class="form-input" required>
            
            <!-- ADICIONE A CLASSE AQUI NO LABEL: class="form-label" -->
            <label class="form-label">Senha:</label>
            <!-- ADICIONE A CLASSE AQUI NO INPUT: class="form-input" -->
            <input type="password" id="senha" class="form-input" required>
            
            <!-- ADICIONE A CLASSE AQUI NO BOTÃO: class="form-button" -->
            <button type="submit" class="form-button">Entrar</button>
            
        </form>

        <!-- ADICIONE A CLASSE AQUI: class="login-footer" -->
        <footer class="login-footer">
          <p>Não tem uma empresa cadastrada? clique <a href="index_cadastro.html">aqui para cadastrar sua empresa!</a></p>
        </footer>
    </div>

    <script src="scripts/login.js"></script>
</body>
</html>
